# Fighters Megamix (Sega Saturn, Sega AM2 1997): per-game settings read by the satrecomp toolkit
# (Makefile, tools and launcher via satrecomp/tools/gamecfg.py).

name = Fighters Megamix
id = fighters_megamix
app_id = io.github.tmcleroy.fightersmegamix
# the disc this port is made from: product number and version from the disc header
# (the first 256 bytes of the data track), and the name shown by the launcher
disc_name = Fighters Megamix (USA)
disc_product = MK-81073
disc_version = V1.004
disclaimer = Not affiliated with Sega.
# the launcher updates itself from this repository's releases (docs/RELEASING.md: each carries update-*.txt)
update_repo = tmcleroy/fighters-megamix-recomp

# Sync points (hex addresses): where a CPU, when free running, pauses so that the other one gets time.
# Both are where the master has just reset the command queue it shares with the slave and goes on to fill it
# (the same code as Fighting Vipers' 0605CC7C); the slave must notice the reset first.
# 06060DF0: the game's own copy; 060D6D78: the movie player's (a second program, loaded at 060C0000)
sync_points = 06060DF0 060D6D78
# Code where the two CPUs alternate in short slices whenever either runs it (hex range): the movie player
# (opening movie) hands the slave a job every frame and waits for it with no sync point that would do
fine_slices = 060C0000-060E0000

# Combined buttons for the Controllers page (satrecomp/port/bindings.h): Saturn buttons pressed at once, then
# a title; none has a key or a button until the player gives it one. A guards, B punches, C kicks.
combos = bc Punch + kick | ab Guard + punch | ac Guard + kick | abc Guard + punch + kick
